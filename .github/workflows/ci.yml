name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  quality-gate:
    name: Hermetic Quality Gate & Concurrency Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          check-latest: true

      - name: Verify Formatting
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "The following files are not properly formatted:"
            gofmt -l .
            exit 1
          fi

      - name: Go Vet
        run: go vet ./...

      - name: Concurrency & Race Detector Suite
        run: go test -v -count=1 -race -timeout 3m ./...

      - name: Bank Simulator Verification
        run: go run ./cmd/bank-sim

      - name: Benchmark Smoke Test
        run: go test -bench=BenchmarkThroughput -benchtime=500ms -benchmem ./benchmarks
